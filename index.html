<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#161a2e;--muted:#5d6380;--line:#dfe2ec;--pink:#d6337a;--blue:#2457c5;--err:#b3261e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#171b2d;--ink:#eceef7;--muted:#9aa0bd;--line:#2a3048;--pink:#f0629f;--blue:#6b93f0;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 26px;display:flex;flex-direction:column;gap:16px}
img{width:56px;height:56px;border-radius:13px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
p{margin:-8px 0 0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;margin-top:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{font:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--pink);border:none;border-radius:10px;padding:13px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:13px;min-height:1.2em;margin-top:-6px}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <button id="go" type="submit">Unlock</button>
</form>
